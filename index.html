    <script>
        // 網頁初始化：從本機口袋拿出記憶的暱稱，沒有就預設為 'ファン'
        let userNickname = localStorage.getItem('skz_nickname') || '○○';

        function openNicknameModal() {
            document.getElementById('nickname-modal').classList.remove('hidden');
            document.getElementById('nickname-input').value = userNickname === '○○' ? '' : userNickname;
        }

        function closeNicknameModal() {
            document.getElementById('nickname-modal').classList.add('hidden');
        }

        function saveNickname() {
            const value = document.getElementById('nickname-input').value.trim();
            userNickname = value !== "" ? value : '○○';
            
            // 永久記住這個名字
            localStorage.setItem('skz_nickname', userNickname);
            closeNicknameModal();
            
            // 儲存後自動重新刷新聊天畫面，讓名字立刻變過來
            if (typeof currentRoomId !== 'undefined' && currentRoomId) {
                loadRoom(currentRoomId); 
            }
        }
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sakura: '#da82a1',
                        nogipurple: '#9e3eb2',     
                        chatbg: '#f6f6f6',     
                        appbg: '#ffffff',      
                    },
                    fontFamily: {
                        sans: ['"Noto Sans JP"', 'sans-serif'],
                    }
                }
            }
        }
        // 🔒 真・軍規級解碼邏輯
        // 注意：這裡「完全沒有」寫上你的密碼，密碼只存在你的腦袋裡！

        // 🔒 真・軍規級雙重解碼邏輯 (一次打開櫻坂與乃木坂保險箱！)
        function unlockDatabase(password) {
            try {
                // 1. 把輸入的密碼轉換成萬能金鑰
                const key = CryptoJS.SHA256(password);
                let unlockedAny = false; // 紀錄有沒有成功打開任何一個
                
                // --- 🌸 嘗試解鎖櫻坂46保險箱 ---
                if (typeof ENCRYPTED_DB !== 'undefined') {
                    const wordsSakura = CryptoJS.enc.Base64.parse(ENCRYPTED_DB);
                    const ivSakura = CryptoJS.lib.WordArray.create(wordsSakura.words.slice(0, 4));
                    const cipherSakura = CryptoJS.lib.WordArray.create(wordsSakura.words.slice(4), wordsSakura.sigBytes - 16);
                    
                    const decryptedSakura = CryptoJS.AES.decrypt({ ciphertext: cipherSakura }, key, {
                        iv: ivSakura, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7
                    });
                    
                    const strSakura = decryptedSakura.toString(CryptoJS.enc.Utf8);
                    if (strSakura) {
                        window.MESSAGES_DB = new Function("return " + strSakura)();
                        unlockedAny = true;
                        window.ENCRYPTED_DB = null; // 🚀 減肥手術：解密完立刻把超肥的亂碼從記憶體刪除！
                    }
                }

                // --- 💜 嘗試解鎖乃木坂46保險箱 ---
                if (typeof NOGI_ENCRYPTED_DB !== 'undefined') {
                    const wordsNogi = CryptoJS.enc.Base64.parse(NOGI_ENCRYPTED_DB);
                    const ivNogi = CryptoJS.lib.WordArray.create(wordsNogi.words.slice(0, 4));
                    const cipherNogi = CryptoJS.lib.WordArray.create(wordsNogi.words.slice(4), wordsNogi.sigBytes - 16);
                    
                    const decryptedNogi = CryptoJS.AES.decrypt({ ciphertext: cipherNogi }, key, {
                        iv: ivNogi, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7
                    });
                    
                    const strNogi = decryptedNogi.toString(CryptoJS.enc.Utf8);
                    if (strNogi) {
                        // 🌟 關鍵！把乃木坂的資料存進專屬的腦區！
                        window.NOGI_MESSAGES_DB = new Function("return " + strNogi)();
                        unlockedAny = true;
                    }
                }

                // 如果兩個保險箱都打不開，就代表密碼錯了
                if (!unlockedAny) throw new Error("密碼錯誤，保險箱無動於衷！");
                
                return true; 
            } catch(e) {
                console.error("解鎖失敗，可能是密碼錯誤！", e);
                return false; 
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const pwdScreen = document.getElementById('password-screen');
            // 如果之前成功開過鎖，瀏覽器會記住那把「鑰匙」
            const savedKey = localStorage.getItem('saved_secret_key');
            if (savedKey) {
                if (unlockDatabase(savedKey)) {
                    pwdScreen.style.display = 'none';
                    // 🌟 這裡記得呼叫你的畫面初始化函數！
                    // 例如：renderCalendar(2026, 5); 或載入首頁列表
                } else {
                    // 如果鑰匙錯了 (可能密碼被你改了)，就清空它要求重填
                    localStorage.removeItem('saved_secret_key');
                }
            }
        });

        function checkPassword() {
            const input = document.getElementById('pwd-input').value;
            const errorMsg = document.getElementById('pwd-error');
            const pwdScreen = document.getElementById('password-screen');

            // 直接拿輸入的文字去試開保險箱
            if (unlockDatabase(input)) {
                // 開鎖成功：把正確的鑰匙存進瀏覽器，下次就不用打
                localStorage.setItem('saved_secret_key', input);
                errorMsg.classList.add('hidden');
                
                // 🌟 這裡記得呼叫你的畫面初始化函數！
                // 例如：renderCalendar(2026, 5);

                pwdScreen.classList.add('opacity-0');
                setTimeout(() => pwdScreen.style.display = 'none', 500);
            } else {
                // 鑰匙插錯了，鎖頭無動於衷
                errorMsg.classList.remove('hidden');
                document.getElementById('pwd-input').value = '';
            }
        }

        document.getElementById('pwd-input')?.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkPassword();
        });
    </script>

        // 1. 渲染無分類列表 (升級版：支援雙團體切換)
        function initList() {
            const grid = document.getElementById('room-grid');

        // 2. 打開聊天室 (支援動態切換資料庫)
        // 2. 打開聊天室 (防崩潰：分批渲染版)
        function openChat(roomId, title) {
            currentMemberId = roomId; 
            
            const activeMemberDB = (currentGroup === 'sakura') ? MEMBER_DB : NOGI_MEMBER_DB;
            const activeMessagesDB = (currentGroup === 'sakura') ? (window.MESSAGES_DB || {}) : (window.NOGI_MESSAGES_DB || {});
            
            const messages = activeMessagesDB[roomId] || [];
            
            chatTitle.innerText = title;
            chatContainer.innerHTML = ''; 
            window.lastSeenMonth = "";
            
            // 處理防呆
            if (messages.length === 0) {
                 chatContainer.innerHTML = `<div class="flex items-center justify-center h-full text-gray-400 text-sm mt-20">目前還沒有訊息資料唷！</div>`;
                 listScreen.classList.replace('active-screen', 'slide-out-left');
                 chatScreen.classList.replace('slide-in-right', 'active-screen');
                 document.getElementById('month-nav-buttons').classList.remove('hidden');
                 return;
            }

            // 先把畫面切換過去，給使用者流暢的感覺
            listScreen.classList.replace('active-screen', 'slide-out-left');
            chatScreen.classList.replace('slide-in-right', 'active-screen');
            document.getElementById('month-nav-buttons').classList.remove('hidden');

            // 🌟 核心減肥手術：分段進食法 (Batch Rendering)
            let batchSize = 150; // 每次只處理 150 則
            let currentIndex = 0;

            function renderNextBatch() {
                if (currentIndex >= messages.length) {
                    // 全部渲染完畢才上色
                    applyThemeColors();
                    return;
                }

                let batchHtml = '';
                let endIndex = Math.min(currentIndex + batchSize, messages.length);
                
                for (let i = currentIndex; i < endIndex; i++) {
                    const msg = messages[i];
                    let rYear = msg.year || 2026;
                    let rMonth = msg.time ? msg.time.split('/')[0] : ""; 
                    let monthKey = `${rYear}/${rMonth}`;
                    let markerClass = "";

                    if (window.lastSeenMonth !== monthKey && rMonth !== "") {
                        markerClass = "month-marker scroll-mt-24"; 
                        window.lastSeenMonth = monthKey;
                    }

                    const sender = activeMemberDB[msg.senderId] || { name: "System", avatar: "https://placehold.co/150x150" };

                    let highResAvatar = sender.avatar;
                    if (highResAvatar.includes("drive.google.com/thumbnail") && !highResAvatar.includes("sz=")) {
                        highResAvatar += "&sz=w1000";
                    }
                    let contentHtml = '';

                    // 圖片
                    if (msg.picture && msg.picture !== "") {
                        let fileId = msg.picture.includes("id=") ? msg.picture.split("id=")[1].split("&")[0] : "";
                        let downloadUrl = fileId ? `https://drive.google.com/uc?export=download&id=${fileId}` : msg.picture;
                        contentHtml += `
                            <br><div class="relative w-full flex justify-center rounded-lg overflow-hidden group min-h-[250px] bg-gray-50">

        // 取得月份字串 (將 5/29 轉成 2026 年 5 月)
        function getMonthKey(timeStr) {
            if(!timeStr) return "未知月份";
            let parts = timeStr.split(' ')[0].split('/'); // 抓出 5/29
            if(parts.length >= 2) {
                // 假設當前年份為 2026

        // 🖼️ 切換媒體櫃分頁邏輯 (支援全年份、不限一年、精準分組版)
        function switchMediaTab(tabType) {
            currentMediaTab = tabType;
            const container = document.getElementById('media-content-container');
            const audioPlayer = document.getElementById('audio-player-ui');
            if (!container) return; // 防呆
            
            // 1. 處理 Tab 按鈕的選取顏色變化
            ['image', 'video', 'audio'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);

                if(t === tabType) {
                    // 被選中的按鈕：拔掉灰色，加上粉色 (變色魔法稍後會自動把粉色轉成紫色)
                    btn.classList.remove('text-gray-300', 'border-transparent');
                    btn.classList.add('text-sakura', 'border-sakura');

                    // 💡 沒被選中的按鈕：把「櫻坂粉」跟「乃木紫」通通拔掉！換回灰色
                    btn.classList.remove('text-sakura', 'border-sakura', 'text-nogipurple', 'border-nogipurple');
                    btn.classList.add('text-gray-300', 'border-transparent');

            // 💡 修復：動態判斷要從櫻坂還是乃木坂的資料庫拿資料！

            const msgs = activeMessagesDB[currentMemberId] || [];
            const targetMsgs = msgs.filter(m => {

                if (tabType === 'video') return m.video && m.video !== '';

                const rYear = msg.year || 2026;

            // 4. 清空容器，準備重新渲染

            // 如果是圖片或影片，隱藏底部語音播放器，並生出 4 排九宮格

                if (sortedKeys.length === 0) {
                    container.innerHTML = `<div class="text-center text-gray-400 mt-10 text-sm">這裡沒有${tabType === 'image' ? '照片' : '影片'}唷！</div>`;

                        let fileId = fileUrl.includes("id=") ? fileUrl.split("id=")[1].split("&")[0] : "";
                        
                        if(tabType === 'image') {

                            html += `<div class="media-grid-item" onclick="viewMediaFull('${fileUrl}', 'image')"><img src="${imgUrl}" loading="lazy"></div>`;

                                </div>`;

                    container.insertAdjacentHTML('beforeend', html);

            } else if (tabType === 'audio') {
                // 如果是語音，秀出底層播放器 UI

                // 💡 修復：動態判斷要抓哪一團的成員大頭貼！

        // 產生月曆積木
        function renderCalendar(year, month) {
            const daysContainer = document.getElementById('calendar-days');
            if(!daysContainer) return; 
            daysContainer.innerHTML = '';
            document.getElementById('calendar-month-year').innerText = `${year} 年 ${month + 1} 月`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            // 🌟 1. 直接抓取資料庫
            const activeMessagesDB = (currentGroup === 'sakura') ? (window.MESSAGES_DB || {}) : (window.NOGI_MESSAGES_DB || {});
            const msgs = activeMessagesDB[currentMemberId] || [];
            const activeDates = new Set();
            
            msgs.forEach(m => {
                // 🌟 2. 核心：直接比對你 Python 寫入的真實 year！
                if (m.year === year) {
                    // 把 05/04 轉成 5 跟 4
                    let parts = m.time.split(/\s+/)[0].split('/');
                    let mMonth = parseInt(parts[0], 10);
                    let mDay = parseInt(parts[1], 10);
                    activeDates.add(`${mMonth}-${mDay}`);
                }
            });

            // 填補前面的空白格子
            for (let i = 0; i < firstDay; i++) {
                daysContainer.innerHTML += `<div class="py-1"><div class="h-8"></div></div>`;
            }

            // 產生日期積木
            for (let i = 1; i <= daysInMonth; i++) {
                const hasMsg = activeDates.has(`${month + 1}-${i}`);

                if (hasMsg) {
                    daysContainer.innerHTML += `
                        <div class="py-1">
                            <div onclick="selectDate(${year}, ${month + 1}, ${i})" class="w-8 h-8 mx-auto flex items-center justify-center rounded-full bg-sakura text-white font-bold cursor-pointer shadow-md hover:scale-110 transition-transform">
                                ${i}
                            </div>
                        </div>`;
                } else {
                    daysContainer.innerHTML += `
                        <div class="py-1">
                            <div onclick="alert('這天沒有傳送訊息唷！')" class="w-8 h-8 mx-auto flex items-center justify-center rounded-full text-gray-400 cursor-pointer hover:bg-gray-100 transition-colors">
                                ${i}
                            </div>
                        </div>`;
                }
            }
            const totalCellsFilled = firstDay + daysInMonth;
            for (let i = totalCellsFilled; i < 42; i++) {
                daysContainer.innerHTML += `<div class="py-1"><div class="h-8"></div></div>`;
            }
            applyThemeColors();

                let exactTimeStr = null;

                // 🌟 1. 先從資料庫找出「這一天第一則訊息」的準確時間 (例如 "05/04 13:05")
                for (let i = 0; i < msgs.length; i++) {
                    if (msgs[i].year === targetYear) {
                        let parts = msgs[i].time.split(/\s+/)[0].split('/');
                        let mMonth = parseInt(parts[0], 10);

                        if (mMonth === targetMonth && mDay === targetDay) {

                // 🌟 2. 雙重保險尋找 DOM 元素
                let foundItem = null;
                
                // 【保險 A】直接抓子元素 (避開 class 名字對不上的問題)
                const domItems = chatContainer.children;
                if (targetIndex !== -1 && domItems[targetIndex]) {
                    foundItem = domItems[targetIndex];
                }

                // 【保險 B】如果陣列對位跑掉，直接拿時間去畫面上無情開搜！
                if (!foundItem || !foundItem.innerText.includes(exactTimeStr)) {
                    const allSpans = chatContainer.querySelectorAll('span');
                    for (let span of allSpans) {
                        // 比對畫面上的文字是不是我們要的時間
                        if (span.innerText.trim() === exactTimeStr) {
                            // 往上找到包含整則訊息的外層大框框
                            foundItem = span.closest('.flex') || span.parentElement.parentElement.parentElement;
                            break;
                        }
                    }
                }

                // 🌟 3. 執行防彈追蹤捲動
                if (foundItem) {
                    foundItem.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    
                    // 連續兩次鎖定，抵抗圖片載入撐開版面的反作用力！
                    setTimeout(() => foundItem.scrollIntoView({ behavior: 'auto', block: 'start' }), 1500);
                    setTimeout(() => foundItem.scrollIntoView({ behavior: 'smooth', block: 'start' }), 2000);

                    // 閃爍提示效果
                    const bubble = foundItem.querySelector('.bg-chatbg') || foundItem.querySelector('div[class*="bg-"]');
                    if(bubble) {
                        bubble.classList.add('!bg-sakura/30', 'transition-colors', 'duration-700');
                        setTimeout(() => bubble.classList.remove('!bg-sakura/30'), 1500);
                    }
                }
            }, 1500);
        }
        window.onload = initList;
        // ==========================================
        // 🌟 新增功能：即時文字搜尋與螢光筆標記
        // ==========================================
        function openSearch() {
            document.getElementById('dropdown-menu').classList.add('hidden'); // 關選單
            document.getElementById('search-bar-container').classList.remove('hidden'); // 秀出搜尋列
            document.getElementById('search-input').focus(); // 自動跳出鍵盤
        }

        function closeSearch() {
            document.getElementById('search-bar-container').classList.add('hidden');
            document.getElementById('search-input').value = '';
            
            // 重新呼叫原本的函數，恢復所有訊息
            const title = document.getElementById('chat-title').innerText;
            openChat(currentMemberId, title); 
        }

        // 監聽輸入框，只要打字就即時過濾！
        document.getElementById('search-input').addEventListener('input', function(e) {
            const keyword = e.target.value.trim().toLowerCase();
            const chatContainer = document.getElementById('chat-container');
            
            // 如果輸入框被清空，就恢復原本的所有對話
            if (!keyword) {
                const title = document.getElementById('chat-title').innerText;
                openChat(currentMemberId, title);
                return;
            }

            // 💡 刪除舊的：const msgs = MESSAGES_DB[currentMemberId];
            // 💡 替換成下面這兩行「變色龍大腦」：
            const activeMessagesDB = (currentGroup === 'sakura') ? (window.MESSAGES_DB || {}) : (window.NOGI_MESSAGES_DB || {});
            const msgs = activeMessagesDB[currentMemberId] || [];
            
            const filteredMsgs = msgs.filter(msg => 
                msg.text && msg.text.toLowerCase().includes(keyword)
            );

            // 如果找不到訊息
            if (filteredMsgs.length === 0) {
                chatContainer.innerHTML = `<div class="text-center text-gray-400 mt-10 text-sm font-medium">找不到包含「${keyword}」的訊息</div>`;
                return;
            }

            
            const activeMemberDB = (currentGroup === 'sakura') ? MEMBER_DB : NOGI_MEMBER_DB;
            const sender = activeMemberDB[currentMemberId] || { name: 'System', avatar: 'assets/default_avatar.png' };
            let fullHtml = '';
            
            filteredMsgs.forEach(msg => {
                // 1. 替換暱稱
                let displayContent = msg.text.replaceAll('%%%', userNickname).replaceAll('％％％', userNickname);
                
                // 2. 🌟 網址轉換魔法：自動轉成藍色超連結
                displayContent = displayContent.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" class="text-blue-500 underline hover:opacity-80 transition-opacity" onclick="event.stopPropagation()">$1</a>');
                
                // 3. 用正則表達式，把關鍵字包上一層黃色背景的 HTML (螢光筆效果)
                // 💡 防護罩 1：過濾特殊符號，避免使用者搜尋符號時當機
                const safeKeyword = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                // 💡 防護罩 2：(?![^<]*>) 是魔法指令，告訴程式「如果這個字在 HTML 標籤 < > 裡面，就不准塗色！」
                const regex = new RegExp(`(${safeKeyword})(?![^<]*>)`, 'gi');
                const highlightedContent = displayContent.replace(regex, `<span class="bg-yellow-200 text-yellow-800 rounded px-1">$1</span>`);
                
                let contentHtml = `<p class="whitespace-pre-wrap leading-relaxed break-all">${highlightedContent}</p>`;
                
                fullHtml += `
                    <div class="flex items-start gap-3 w-full mb-6 relative message-item" data-type="text">
                        <img src="${sender.avatar}" class="w-10 h-10 rounded-full object-cover border border-gray-100 flex-shrink-0 shadow-sm z-10" loading="lazy">
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center justify-between mb-1">
                                <div class="flex items-baseline gap-3">
                                    <span class="text-xs text-gray-700 font-bold">${sender.name}</span>
                                    <span class="text-[10px] text-gray-500">${msg.time}</span>
                                </div>
                            </div>
                            <div class="bg-chatbg rounded-xl rounded-tl-sm p-3 inline-block shadow-sm max-w-full overflow-hidden">
                                ${contentHtml}
                            </div>
                        </div>
                    </div>
                `;
            });
            
            chatContainer.innerHTML = fullHtml;
            applyThemeColors();
        });
        // ==========================================
        // 🎬 全螢幕劇院控制功能 (完全獨立，不干擾圖片)
        // ==========================================
        function openTheaterModal(viewUrl) {
            const modal = document.getElementById('theater-modal');
            const container = document.getElementById('theater-container');
            
            modal.classList.remove('hidden');
            
            setTimeout(() => {
                modal.classList.remove('opacity-0');
            }, 10);
            
            container.innerHTML = `
                <iframe src="${viewUrl}" 
                        class="w-full h-full border-0" 
                        frameborder="0" 
                        allow="autoplay; encrypted-media" 
                        allowfullscreen>
                </iframe>
            `;
        }

        function closeTheaterModal() {
            const modal = document.getElementById('theater-modal');
            const container = document.getElementById('theater-container');
            
            modal.classList.add('opacity-0');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                container.innerHTML = ''; 
            }, 300);
        }
        // ==========================================
        // 🎵 全域音樂播放器核心系統
        // ==========================================
        const globalAudio = document.createElement('video');
        let isDragging = false;
        let currentFallbackEmbedUrl = ''; // 記住目前的防呆網址

        function playGlobalAudio(streamUrl, fallbackEmbedUrl) {
            const ui = document.getElementById('audio-player-ui');
            const playIcon = document.getElementById('audio-play-icon');
            
            ui.classList.remove('hidden'); 
            currentFallbackEmbedUrl = fallbackEmbedUrl; // 把防呆網址存起來
            
            if(globalAudio.src === streamUrl) {
                toggleAudio();
                return;
            }

            globalAudio.src = streamUrl;
            
            // 加上 Promise 錯誤捕捉 (跟內嵌版一樣的防呆機制)
            globalAudio.play().then(() => {
                playIcon.classList.remove('fa-play');
                playIcon.classList.add('fa-pause');
                playIcon.classList.remove('ml-1');
            }).catch(e => {
                console.error("全域播放失敗:", e);
                // 播放失敗時，自動關閉底部播放器，並叫出全螢幕劇院！
                closeGlobalAudio();
                openTheaterModal(currentFallbackEmbedUrl);
            });
        }

        function toggleAudio() {
            const playIcon = document.getElementById('audio-play-icon');
            if (globalAudio.paused) {
                globalAudio.play().then(() => {
                    playIcon.classList.replace('fa-play', 'fa-pause');
                    playIcon.classList.remove('ml-1');
                }).catch(e => {
                    closeGlobalAudio();
                    openTheaterModal(currentFallbackEmbedUrl);
                });
            } else {
                globalAudio.pause();
                playIcon.classList.replace('fa-pause', 'fa-play');
                playIcon.classList.add('ml-1');
            }
        }

        // 時間格式化工具 (將秒數轉為 01:23)
        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        // 監聽播放進度，即時更新進度條與文字
        globalAudio.addEventListener('timeupdate', () => {
            if (isDragging) return; // 如果使用者正在拖曳，先不要自動更新
            
            const progress = document.getElementById('audio-progress-bar');
            const handle = document.getElementById('audio-progress-handle');
            const timeDisplay = document.getElementById('audio-time-display');
            
            if (globalAudio.duration) {
                const percent = (globalAudio.currentTime / globalAudio.duration) * 100;
                progress.style.width = `${percent}%`;
                handle.style.left = `${percent}%`;
                timeDisplay.innerText = `${formatTime(globalAudio.currentTime)} / ${formatTime(globalAudio.duration)}`;
            }
        });

        // 點擊進度條跳轉功能
        function seekAudio(event) {
            if (!globalAudio.duration) return;
            const bg = document.getElementById('audio-progress-bg');
            const rect = bg.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const percent = Math.max(0, Math.min(1, clickX / rect.width));
            
            globalAudio.currentTime = percent * globalAudio.duration;
        }

        // 播放結束時自動恢復為 Play 按鈕
        globalAudio.addEventListener('ended', () => {
            const playIcon = document.getElementById('audio-play-icon');
            playIcon.classList.replace('fa-pause', 'fa-play');
            playIcon.classList.add('ml-1');
            document.getElementById('audio-progress-bar').style.width = '0%';
            document.getElementById('audio-progress-handle').style.left = '0%';
        }); 

        // 關閉播放器介面並停止播放
        function closeGlobalAudio() {
            globalAudio.pause();
            document.getElementById('audio-player-ui').classList.add('hidden');
        }
        // ==========================================
        // 🎵 聊天室專屬：內嵌式語音播放器系統
        // ==========================================
        let currentInlineAudio = null;
        let currentInlinePlayIcon = null;

        function toggleInlineAudio(id, fallbackEmbedUrl) {
            const audio = document.getElementById(id + '-audio');
            const icon = document.getElementById(id + '-icon');

            if (!audio) return;

            if (currentInlineAudio && currentInlineAudio !== audio) {
                currentInlineAudio.pause();
                if (currentInlinePlayIcon) {
                    currentInlinePlayIcon.classList.replace('fa-pause', 'fa-play');
                    currentInlinePlayIcon.classList.add('ml-1');
                }
            }

            if (audio.paused) {
                audio.play().then(() => {
                    icon.classList.replace('fa-play', 'fa-pause');
                    icon.classList.remove('ml-1');
                    currentInlineAudio = audio;
                    currentInlinePlayIcon = icon;
                }).catch(e => {
                    console.error("播放失敗:", e);
                    // 💡 如果還是被 Google 擋下，我們不開新分頁了！直接叫出我們的全螢幕劇院
                    openTheaterModal(fallbackEmbedUrl);
                });
            } else {
                audio.pause();
                icon.classList.replace('fa-pause', 'fa-play');
                icon.classList.add('ml-1');
            }
        }

        // ==========================================
        // 📅 快速跳月份系統 (防彈跳轉升級版)
        // ==========================================
        function jumpMonth(direction) {
            // 抓出所有貼了標籤的「每月第一則訊息」
            const markers = Array.from(document.querySelectorAll('.month-marker'));
            if (markers.length === 0) return;

            let target = null;
            
            if (direction === 'up') {
                for (let i = markers.length - 1; i >= 0; i--) {
                    if (markers[i].getBoundingClientRect().top < -10) { 
                        target = markers[i];
                        break;
                    }
                }
            } else {
                for (let i = 0; i < markers.length; i++) {
                    if (markers[i].getBoundingClientRect().top > 150) { 
                        target = markers[i];
                        break;
                    }
                }
            }

            if (target) {
                // 💡 升級 1：先用 auto 瞬間瞬移過去，躲開所有還沒載入的圖片陷阱！
                target.scrollIntoView({ behavior: 'auto', block: 'start' });
                
                // 💡 升級 2：等 0.3 秒，附近的圖片載入完畢後，再平滑地「精準校正」一次！
                setTimeout(() => {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    
                    // 順便加上變色龍發光特效，讓你知道跳到哪一則了
                    const bubble = target.querySelector('.bg-chatbg') || target.querySelector('div[class*="bg-"]');
                    if(bubble) {
                        const glowClass = (currentGroup === 'sakura') ? '!bg-sakura/30' : '!bg-nogipurple/30';
                        bubble.classList.add(glowClass, 'transition-colors', 'duration-700');
                        setTimeout(() => bubble.classList.remove(glowClass), 1500);
                    }
                }, 300);
            }
        }

        // 點擊進度條跳轉功能
        function seekInlineAudio(event, id) {
            const audio = document.getElementById(id + '-audio');
            if (!audio || !audio.duration) return;

            const bg = event.currentTarget;
            const rect = bg.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const percent = Math.max(0, Math.min(1, clickX / rect.width));

            audio.currentTime = percent * audio.duration;
        }

        // 播放完畢自動重置
        function resetInlineAudio(id) {
            const icon = document.getElementById(id + '-icon');
            const progress = document.getElementById(id + '-progress');
            const handle = document.getElementById(id + '-handle');
            const audio = document.getElementById(id + '-audio');

            if(icon) {
                icon.classList.replace('fa-pause', 'fa-play');
                icon.classList.add('ml-1');
            }
            if(progress) progress.style.width = '0%';
            if(handle) handle.style.left = '0%';
            if(audio) audio.currentTime = 0;
        }

        // 載入完成時，預先顯示語音的總長度
        function initInlineAudio(id) {
            const audio = document.getElementById(id + '-audio');
            const timeDisplay = document.getElementById(id + '-time');
            if (audio && audio.duration && timeDisplay) {
                timeDisplay.innerText = "00:00 / " + formatTime(audio.duration);
            }
        }
        // ==========================================
        // 🎨 變色龍主題系統 (內頁白底粉字 / 白底紫字 自動切換)
        // ==========================================
        function applyThemeColors() {
            // 💡 精準掃描！避開裝了幾萬則訊息的 chat-container，只掃描外層的 UI 介面
            const screens = [
                document.querySelector('#chat-screen header'), // 聊天室標題列
                document.getElementById('dropdown-menu'),      // 右上角選單
                document.getElementById('month-nav-buttons'),  // 上下月跳轉鈕
                document.getElementById('search-bar-container'),// 搜尋列
                document.getElementById('media-screen'),       // 媒體庫
                document.getElementById('date-picker-modal'),  // 日曆
                document.getElementById('audio-player-ui')     // 語音播放器
            ];
            
            screens.forEach(container => {
                if (!container) return;
                
                // 找出所有身上帶有櫻坂粉、乃木紫相關 class 的元素
                const elements = container.querySelectorAll('[class*="sakura"], [class*="pink-"], [class*="nogipurple"], [class*="purple-"]');
                
                elements.forEach(el => {
                    let cls = el.getAttribute('class');
                    if (!cls) return;

                    if (currentGroup === 'nogi') {
                        // 💜 轉換為乃木紫模式 (白底紫字)
                        cls = cls.replaceAll('sakura', 'nogipurple')
                                 .replaceAll('pink-100', 'purple-200')
                                 .replaceAll('pink-50', 'purple-50')
                                 .replaceAll('bg-purple-500', 'bg-nogipurple')
                                 .replaceAll('text-purple-600', 'text-nogipurple')
                                 .replaceAll('text-purple-500', 'text-nogipurple');
                    } else {
                        // 🌸 轉換回櫻坂粉模式 (白底粉字)
                        cls = cls.replaceAll('nogipurple', 'sakura')
                                 .replaceAll('purple-200', 'pink-100')
                                 .replaceAll('purple-50', 'pink-50');
                    }
                    el.setAttribute('class', cls);
                });
            });
        }
    </script>
    <div id="media-modal" onclick="closeMediaModal()">
        <button id="modal-close-btn">&times;</button>
        <img id="modal-media-content-img" class="hidden" src="" alt="大圖模式">
        <video id="modal-media-content-video" class="hidden" src="" controls></video>
        <audio id="modal-media-content-audio" class="hidden" src="" controls></audio>
    </div>
    <div id="date-picker-modal" class="hidden fixed inset-0 z-[100] bg-black/40 flex flex-col justify-end transition-opacity">
        <div class="bg-white rounded-t-3xl p-4 pb-8 shadow-2xl w-full max-w-md mx-auto relative transform transition-transform translate-y-0">
            
            <div class="flex justify-center items-center mb-6 text-gray-700 relative mt-2">
                <div class="flex items-center gap-6">
                    <button onclick="changeMonth(-1)" class="p-2 hover:bg-gray-100 rounded-full w-10 h-10 flex justify-center items-center transition-colors">

            <div class="grid grid-cols-7 text-center text-xs text-gray-400 mb-4 font-medium">
                <div class="text-red-400">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="text-blue-400">土</div>

            <h3 class="text-base font-bold text-gray-800 mb-2">設定暱稱</h3>
            <input type="text" id="nickname-input" placeholder="請輸入暱稱 (預設: OO)" 
                class="w-full border border-gray-200 rounded-xl p-3 mb-4 focus:outline-none focus:border-pink-400 focus:ring-1 focus:ring-pink-400 text-sm">
            <div class="flex justify-end gap-2 text-sm font-medium">
                <button onclick="closeNicknameModal()" class="px-4 py-2 text-gray-400 hover:bg-gray-50 rounded-xl transition-colors">取消</button>
                <button onclick="saveNickname()" class="px-4 py-2 bg-pink-500 text-white rounded-xl hover:bg-pink-600 transition-colors shadow-sm">儲存設定</button>
            </div>
        </div>
    </div>
    <div id="theater-modal" class="fixed inset-0 bg-black z-[9999] hidden flex-col items-center justify-center opacity-0 transition-opacity duration-300">
        
        <button onclick="closeTheaterModal()" class="absolute top-[50px] left-4 text-white w-10 h-10 flex items-center justify-center text-2xl z-[10000] bg-black/50 rounded-full hover:bg-black/70 transition-colors shadow-lg border border-white/20">
            <i class="fas fa-times"></i>
        </button>

        <div id="theater-container" class="w-full h-full bg-black relative flex items-center justify-center">
            </div>
    </div>
    
</body>
