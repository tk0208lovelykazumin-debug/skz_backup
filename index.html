        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sakura: '#da82a1',     
                        chatbg: '#f6f6f6',     
                        appbg: '#ffffff',

                    fontFamily: {
                        sans: ['"Noto Sans JP"', 'sans-serif'],

        // 🔒 真・軍規級解碼邏輯
        // 注意：這裡「完全沒有」寫上你的密碼，密碼只存在你的腦袋裡！

        function unlockDatabase(password) {
            try {
                // 1. 把輸入的文字，轉換成開鎖用的金鑰
                const key = CryptoJS.SHA256(password);
                
                // 2. 讀取 Python 加密過的亂碼
                const ciphertextWords = CryptoJS.enc.Base64.parse(ENCRYPTED_DB);
                
                // 3. 把前 16 bytes 拆出來當作 IV (擾亂碼)
                const iv = CryptoJS.lib.WordArray.create(ciphertextWords.words.slice(0, 4));
                // 4. 剩下的才是真正的鎖死內容
                const ciphertext = CryptoJS.lib.WordArray.create(ciphertextWords.words.slice(4), ciphertextWords.sigBytes - 16);
                
                // 5. 暴力開鎖！
                const decrypted = CryptoJS.AES.decrypt({ ciphertext: ciphertext }, key, {
                    iv: iv,
                    mode: CryptoJS.mode.CBC,
                    padding: CryptoJS.pad.Pkcs7
                });
                
                // 6. 把解碼後的內容轉回文字 (如果密碼錯了，這裡會直接失敗)
                const decryptedStr = decrypted.toString(CryptoJS.enc.Utf8);
                if (!decryptedStr) throw new Error("密碼錯誤，解不開保險箱");
                
                // 7. 成功解鎖！把資料塞進網站大腦
                window.MESSAGES_DB = new Function("return " + decryptedStr)();
                return true; 
            } catch(e) {
                console.error("解鎖失敗，可能是密碼錯誤！");
                return false; 
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const pwdScreen = document.getElementById('password-screen');
            // 如果之前成功開過鎖，瀏覽器會記住那把「鑰匙」
            const savedKey = localStorage.getItem('saved_secret_key');
            if (savedKey) {
                if (unlockDatabase(savedKey)) {
                    pwdScreen.style.display = 'none';
                    // 🌟 這裡記得呼叫你的畫面初始化函數！
                    // 例如：renderCalendar(2026, 5); 或載入首頁列表
                } else {
                    // 如果鑰匙錯了 (可能密碼被你改了)，就清空它要求重填
                    localStorage.removeItem('saved_secret_key');
                }
            }
        });

        function checkPassword() {
            const input = document.getElementById('pwd-input').value;
            const errorMsg = document.getElementById('pwd-error');
            const pwdScreen = document.getElementById('password-screen');

            // 直接拿輸入的文字去試開保險箱
            if (unlockDatabase(input)) {
                // 開鎖成功：把正確的鑰匙存進瀏覽器，下次就不用打
                localStorage.setItem('saved_secret_key', input);
                errorMsg.classList.add('hidden');
                
                // 🌟 這裡記得呼叫你的畫面初始化函數！
                // 例如：renderCalendar(2026, 5);

                pwdScreen.classList.add('opacity-0');
                setTimeout(() => pwdScreen.style.display = 'none', 500);
            } else {
                // 鑰匙插錯了，鎖頭無動於衷
                errorMsg.classList.remove('hidden');
                document.getElementById('pwd-input').value = '';
            }
        }

        document.getElementById('pwd-input')?.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkPassword();
        });
    </script>

        function getMonthKey(timeStr) {
            if(!timeStr) return "未知月份";
            let parts = timeStr.split(' ')[0].split('/'); // 抓出 5/29
            if(parts.length >= 2) {

        // 🖼️ 切換媒體櫃分頁邏輯 (支援全年份、不限一年、精準分組版)
        function switchMediaTab(tabType) {
            currentMediaTab = tabType;
            const container = document.getElementById('media-content-container');
            const audioPlayer = document.getElementById('audio-player-ui');
            if (!container) return; // 防呆
            
            // 1. 處理 Tab 按鈕的選取顏色變化
            ['image', 'video', 'audio'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);

                if(t === tabType) {
                    btn.classList.remove('text-gray-300', 'border-transparent');
                    btn.classList.add('text-sakura', 'border-sakura');
                } else {
                    btn.classList.remove('text-sakura', 'border-sakura');
                    btn.classList.add('text-gray-300', 'border-transparent');

            // 2. 抓取目前成員的媒體，並過濾出當前分頁的類型 (image/video/audio)

            // 3. 將資料按「真實年份 + 月份」進行完美分組
            const groupedData = {};
            targetMsgs.forEach(msg => {
                // 讀取 Python 塞入的 msg.year，如果防呆沒抓到就預設 2026
                const rYear = msg.year || 2026;
                // 從 "05/17 14:30" 中切出月份
                const rMonth = msg.time.split(/\s+/)[0].split('/')[0];
                
                // 組裝成唯一的 Key，例如 "2025 年 05 月" 或 "2026 年 04 月"
                const groupKey = `${rYear} 年 ${rMonth} 月`;
                
                if (!groupedData[groupKey]) {
                    groupedData[groupKey] = [];
                }
                groupedData[groupKey].push(msg);
            });

            // 4. 清空容器，準備重新渲染
            container.innerHTML = '';

            // 如果是圖片或影片，隱藏底部語音播放器，並生出 4 排九宮格
            if(tabType === 'image' || tabType === 'video') {
                if (audioPlayer) audioPlayer.classList.add('hidden');
                
                // 照時間或 Key 排序，讓舊年份到新年份都排出來
                const sortedKeys = Object.keys(groupedData).sort(); // 最新月份在最上面
                
                if (sortedKeys.length === 0) {
                    container.innerHTML = `<div class="text-center text-gray-400 mt-10 text-sm">這裡沒有${tabType === 'image' ? '照片' : '影片'}唷！</div>`;

                    let html = `<div class="month-header">${groupTitle}</div><div class="media-grid">`;
                    
                    groupedData[groupTitle].forEach(msg => {
                        // 嘗試從網址提取 Google Drive 的 file ID
                        let fileId = msg.content.includes("id=") ? msg.content.split("id=")[1].split("&")[0] : "";
                        
                        if(tabType === 'image') {
                            // 圖片：點擊啟動滿版檢視器
                            let imgUrl = fileId ? `https://drive.google.com/thumbnail?id=${fileId}&sz=w500` : msg.content;
                            html += `<div class="media-grid-item" onclick="viewMediaFull('${msg.content}', 'image')"><img src="${imgUrl}" loading="lazy"></div>`;
                        } else if(tabType === 'video') {
                            // 影片：有縮圖並跳轉到雲端播放

                            let thumbUrl = fileId ? `https://drive.google.com/thumbnail?id=${fileId}&sz=w500` : "";
                            html += `
                                <div class="media-grid-item" onclick="window.open('${viewUrl}', '_blank')">
                                    <img src="${thumbUrl}" loading="lazy">
                                    <div class="absolute inset-0 flex items-center justify-center"><i class="fas fa-play text-white/80 text-2xl drop-shadow-md"></i></div>
                                </div>`;
                        }
                    });
                    html += `</div>`;
                    container.insertAdjacentHTML('beforeend', html);
                });

            } else if (tabType === 'audio') {
                // 如果是語音，秀出底層播放器 UI
                if (audioPlayer) audioPlayer.classList.remove('hidden');
                
                const sender = MEMBER_DB[currentMemberId] || { name: "Member", avatar: "" };

        // 產生月曆積木
        function renderCalendar(year, month) {
            const daysContainer = document.getElementById('calendar-days');
            if(!daysContainer) return; 
            daysContainer.innerHTML = '';
            document.getElementById('calendar-month-year').innerText = `${year} 年 ${month + 1} 月`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            // 🌟 1. 直接抓取資料庫
            const msgs = (typeof MESSAGES_DB !== 'undefined' && MESSAGES_DB[currentMemberId]) ? MESSAGES_DB[currentMemberId] : [];
            const activeDates = new Set();
            
            msgs.forEach(m => {
                // 🌟 2. 核心：直接比對你 Python 寫入的真實 year！
                if (m.year === year) {
                    // 把 05/04 轉成 5 跟 4
                    let parts = m.time.split(/\s+/)[0].split('/');
                    let mMonth = parseInt(parts[0], 10);
                    let mDay = parseInt(parts[1], 10);
                    activeDates.add(`${mMonth}-${mDay}`);
                }
            });

            // 填補前面的空白格子
            for (let i = 0; i < firstDay; i++) {
                daysContainer.innerHTML += `<div></div>`;
            }

            // 產生日期積木
            for (let i = 1; i <= daysInMonth; i++) {
                const hasMsg = activeDates.has(`${month + 1}-${i}`);

                if (hasMsg) {
                    daysContainer.innerHTML += `
                        <div class="py-1">
                            <div onclick="selectDate(${year}, ${month + 1}, ${i})" class="w-8 h-8 mx-auto flex items-center justify-center rounded-full bg-sakura text-white font-bold cursor-pointer shadow-md hover:scale-110 transition-transform">
                                ${i}
                            </div>
                        </div>`;
                } else {
                    daysContainer.innerHTML += `
                        <div class="py-1">
                            <div onclick="alert('這天沒有傳送訊息唷！')" class="w-8 h-8 mx-auto flex items-center justify-center rounded-full text-gray-400 cursor-pointer hover:bg-gray-100 transition-colors">
                                ${i}
                            </div>
                        </div>`;
                }
            }
        }

                const chatContainer = document.getElementById('chat-container');
                if (!chatContainer) return;

                const msgs = (typeof MESSAGES_DB !== 'undefined' && MESSAGES_DB[currentMemberId]) ? MESSAGES_DB[currentMemberId] : [];
                
                let exactTimeStr = null;
                let targetIndex = -1;

                // 🌟 1. 先從資料庫找出「這一天第一則訊息」的準確時間 (例如 "05/04 13:05")
                for (let i = 0; i < msgs.length; i++) {
                    if (msgs[i].year === targetYear) {
                        let parts = msgs[i].time.split(/\s+/)[0].split('/');
                        let mMonth = parseInt(parts[0], 10);
                        let mDay = parseInt(parts[1], 10);
                        
                        if (mMonth === targetMonth && mDay === targetDay) {
                            exactTimeStr = msgs[i].time;
                            targetIndex = i;
                            break;
                        }
                    }
                }

                if (!exactTimeStr) return; // 沒找到就提早結束

                // 🌟 2. 雙重保險尋找 DOM 元素
                let foundItem = null;
                
                // 【保險 A】直接抓子元素 (避開 class 名字對不上的問題)
                const domItems = chatContainer.children;
                if (targetIndex !== -1 && domItems[targetIndex]) {
                    foundItem = domItems[targetIndex];
                }

                // 【保險 B】如果陣列對位跑掉，直接拿時間去畫面上無情開搜！
                if (!foundItem || !foundItem.innerText.includes(exactTimeStr)) {
                    const allSpans = chatContainer.querySelectorAll('span');
                    for (let span of allSpans) {
                        // 比對畫面上的文字是不是我們要的時間
                        if (span.innerText.trim() === exactTimeStr) {
                            // 往上找到包含整則訊息的外層大框框
                            foundItem = span.closest('.flex') || span.parentElement.parentElement.parentElement;
                            break;
                        }
                    }
                }

                // 🌟 3. 執行防彈追蹤捲動
                if (foundItem) {
                    foundItem.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    
                    // 連續兩次鎖定，抵抗圖片載入撐開版面的反作用力！
                    setTimeout(() => foundItem.scrollIntoView({ behavior: 'auto', block: 'start' }), 400);
                    setTimeout(() => foundItem.scrollIntoView({ behavior: 'smooth', block: 'start' }), 800);

                    // 閃爍提示效果
                    const bubble = foundItem.querySelector('.bg-chatbg') || foundItem.querySelector('div[class*="bg-"]');
                    if(bubble) {
                        bubble.classList.add('!bg-sakura/30', 'transition-colors', 'duration-700');
                        setTimeout(() => bubble.classList.remove('!bg-sakura/30'), 1500);
                    }
                }
            }, 400);
        }
        window.onload = initList;
        // ==========================================
        // 🌟 新增功能：即時文字搜尋與螢光筆標記
        // ==========================================
        function openSearch() {
            document.getElementById('dropdown-menu').classList.add('hidden'); // 關選單
            document.getElementById('search-bar-container').classList.remove('hidden'); // 秀出搜尋列
            document.getElementById('search-input').focus(); // 自動跳出鍵盤
        }

        function closeSearch() {
            document.getElementById('search-bar-container').classList.add('hidden');
            document.getElementById('search-input').value = '';
            
            // 重新呼叫原本的函數，恢復所有訊息
            const title = document.getElementById('chat-title').innerText;
            openChat(currentMemberId, title); 
        }

        // 監聽輸入框，只要打字就即時過濾！
        document.getElementById('search-input').addEventListener('input', function(e) {
            const keyword = e.target.value.trim().toLowerCase();
            const chatContainer = document.getElementById('chat-container');
            
            // 如果輸入框被清空，就恢復原本的所有對話
            if (!keyword) {
                const title = document.getElementById('chat-title').innerText;
                openChat(currentMemberId, title);
                return;
            }

            // 安全抓取該成員的資料
            const msgs = (typeof MESSAGES_DB !== 'undefined' ? MESSAGES_DB[currentMemberId] : []) || [];
            
            const filteredMsgs = msgs.filter(msg => 
                msg.type === 'text' && msg.content.toLowerCase().includes(keyword)
            );

            // 如果找不到訊息
            if (filteredMsgs.length === 0) {
                chatContainer.innerHTML = `<div class="text-center text-gray-400 mt-10 text-sm font-medium">找不到包含「${keyword}」的訊息</div>`;
                return;
            }

            // 🌟 致命 Bug 修復：這裡原本寫錯成 memberData，現在改回你正確的 MEMBER_DB！
            const sender = MEMBER_DB[currentMemberId] || { name: "System", avatar: "" };
            let fullHtml = '';
            
            filteredMsgs.forEach(msg => {
                // 用正則表達式，把關鍵字包上一層黃色背景的 HTML (螢光筆效果)
                const regex = new RegExp(`(${keyword})`, 'gi');
                const highlightedContent = msg.content.replace(regex, `<span class="bg-yellow-200 text-yellow-800 rounded px-1">$1</span>`);
                
                let contentHtml = `<p class="whitespace-pre-wrap leading-relaxed break-all">${highlightedContent}</p>`;
                
                fullHtml += `
                    <div class="flex items-start gap-3 w-full mb-6 relative message-item" data-type="text">
                        <img src="${sender.avatar}" class="w-10 h-10 rounded-full object-cover border border-gray-100 flex-shrink-0 shadow-sm z-10" loading="lazy">
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center justify-between mb-1">
                                <div class="flex items-baseline gap-3">
                                    <span class="text-xs text-gray-700 font-bold">${sender.name}</span>
                                    <span class="text-[10px] text-gray-500">${msg.time}</span>
                                </div>
                            </div>
                            <div class="bg-chatbg rounded-xl rounded-tl-sm p-3 inline-block shadow-sm max-w-full overflow-hidden">
                                ${contentHtml}
                            </div>
                        </div>
                    </div>
                `;
            });
            
            chatContainer.innerHTML = fullHtml;
        });
         
    </script>
    <div id="media-modal" onclick="closeMediaModal()">
        <button id="modal-close-btn">&times;</button>
        <img id="modal-media-content-img" class="hidden" src="" alt="大圖模式">
        <video id="modal-media-content-video" class="hidden" src="" controls></video>
        <audio id="modal-media-content-audio" class="hidden" src="" controls></audio>
    </div>
    <div id="date-picker-modal" class="hidden fixed inset-0 z-[100] bg-black/40 flex flex-col justify-end transition-opacity">
        <div class="bg-white rounded-t-3xl p-4 pb-8 shadow-2xl w-full max-w-md mx-auto relative transform transition-transform translate-y-0">
            
            <div class="flex justify-center items-center mb-6 text-gray-700 relative mt-2">
                <div class="flex items-center gap-6">
                    <button onclick="changeMonth(-1)" class="p-2 hover:bg-gray-100 rounded-full w-10 h-10 flex justify-center items-center transition-colors">
                        <i class="fas fa-chevron-left text-sakura text-xl"></i>
                    </button>
                    <span id="calendar-month-year" class="font-medium text-[15px] tracking-widest w-28 text-center">2026 年 5 月</span>
                    <button onclick="changeMonth(1)" class="p-2 hover:bg-gray-100 rounded-full w-10 h-10 flex justify-center items-center transition-colors">
                        <i class="fas fa-chevron-right text-sakura text-xl"></i>
                    </button>
                </div>
                <button onclick="closeDatePicker()" class="absolute right-2 text-gray-400 hover:text-gray-600 text-2xl transition-colors">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="grid grid-cols-7 text-center text-xs text-gray-400 mb-4 font-medium">
                <div class="text-red-400">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="text-blue-400">土</div>
            </div>
            
            <div id="calendar-days" class="grid grid-cols-7 text-center gap-y-4 text-sm font-medium text-gray-700 pb-4">
                </div>
            
        </div>
    </div>
